# docker compose v2
# Usage:
#   docker compose up -d           # build image and serve app on http://localhost:4200
#   docker compose up -d --build   # force rebuild after source changes
#
# For development with hot-reload use `npm start` instead (ng serve on :4200).
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumacare-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      # Backend service hostname and port reachable from within this Compose network.
      # Override to point at a remote backend when running standalone.
      BACKEND_HOST: ${BACKEND_HOST:-localhost}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      # OAuth2 issuer URI injected into the CSP connect-src header so the
      # browser can reach the token endpoint directly.
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:9000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
