# ─── Rate-limit zones ─────────────────────────────────────────────────────────
# Included inside nginx's http{} block (via `include /etc/nginx/conf.d/*.conf;`).
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ─── Backend upstream ─────────────────────────────────────────────────────────
# ${BACKEND_HOST} and ${BACKEND_PORT} are substituted at container startup by
# envsubst (see Dockerfile CMD). In compose.yaml the backend service name is
# "app" reachable on port 8080 within the Docker network.
upstream backend {
    server ${BACKEND_HOST}:${BACKEND_PORT};
    keepalive 32;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    # IMPORTANT: any location block that defines its own add_header directives
    # will NOT inherit these server-level headers. Avoid add_header in child
    # location blocks, or repeat all security headers there.
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header X-XSS-Protection          "1; mode=block"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ${OAUTH2_ISSUER_URI} is substituted at startup. It must appear in
    # connect-src so the SPA can reach the OAuth2 token endpoint from the
    # browser (authorisation-code + PKCE flow).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${OAUTH2_ISSUER_URI}; frame-ancestors 'none';" always;

    # ── Block backend-internal endpoints at the edge ─────────────────────────
    # SecurityFilter.shouldNotFilter() already skips /actuator internally;
    # this adds an independent edge-level block so the endpoint is never
    # reachable on the public-facing port.
    location /actuator/ {
        return 403;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        # Clear Connection header to enable upstream keepalive.
        proxy_set_header   Connection        "";

        # Forward the real client IP to Spring Boot.
        # Requires server.forward-headers-strategy=native in application.yml
        # so SecurityFilter.getRemoteAddr() returns the actual client IP
        # (not nginx's container IP), preserving per-IP rate-limiting and
        # blacklisting stored in Redis.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass JWT bearer token through unchanged.
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Long-lived cache for Angular content-hashed assets ───────────────────
    # Angular names bundles with an 8+ hex-char hash (e.g. main.abc12345.js).
    # `expires 1y` also sets Cache-Control: max-age=31536000.
    # No add_header here so server-level security headers are inherited.
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|webp)$ {
        expires    1y;
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
