<aside class="fixed left-0 top-0 z-30 flex h-screen w-20 flex-col items-center border-r border-slate-800 bg-slate-950 py-5">
  <a
    routerLink="/"
    aria-label="Ir al tablero · PneumaCare"
    class="mb-10 flex flex-col items-center gap-1.5 rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950"
  >
    <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-cyan-500/20 font-mono text-sm font-bold text-cyan-200 shadow-lg shadow-cyan-500/20" aria-hidden="true">PC</span>
    <span class="text-[10px] font-semibold tracking-tight text-slate-300">PneumaCare</span>
  </a>

  <nav class="flex flex-1 flex-col items-center gap-2" aria-label="Secciones del tablero">
    @for (item of navItems(); track item.label) {
      @if (item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [attr.aria-label]="item.label"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          class="relative flex h-11 w-11 items-center justify-center rounded-xl text-xs font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300"
          [class]="rla.isActive
            ? 'bg-cyan-500/15 text-cyan-300'
            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'"
        >
          @if (rla.isActive) {
            <span class="absolute -left-5 top-1/2 h-6 w-1 -translate-y-1/2 rounded-r-full bg-cyan-400"></span>
          }
          {{ item.short }}
        </a>
      } @else {
        <button
          type="button"
          disabled
          aria-disabled="true"
          [attr.aria-label]="item.label + ' (próximamente)'"
          [attr.title]="item.label + ' · próximamente'"
          class="flex h-11 w-11 cursor-not-allowed items-center justify-center rounded-xl text-xs font-semibold text-slate-600"
        >
          {{ item.short }}
        </button>
      }
    }
  </nav>
</aside>
