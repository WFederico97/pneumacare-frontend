<aside class="fixed left-0 top-0 z-30 flex h-screen w-20 flex-col items-center border-r border-slate-800 bg-slate-950 py-5">
  <div class="mb-10 flex flex-col items-center gap-1.5">
    <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-cyan-500/20 text-cyan-200 shadow-lg shadow-cyan-500/20">
      <span class="text-sm font-bold">PC</span>
    </div>
    <span class="text-[10px] font-semibold tracking-tight text-slate-300">PneumaCare</span>
  </div>

  <nav class="flex flex-1 flex-col items-center gap-2" aria-label="Secciones del tablero">
    @for (item of navItems; track item.label) {
      <button
        type="button"
        class="relative flex h-11 w-11 items-center justify-center rounded-xl text-[10px] font-semibold transition-colors"
        [class]="item.label === 'Tablero'
          ? 'bg-cyan-500/15 text-cyan-300'
          : 'text-slate-500 hover:bg-slate-800 hover:text-slate-200'"
        [attr.aria-label]="item.label"
      >
        @if (item.label === 'Tablero') {
          <span class="absolute -left-5 top-1/2 h-6 w-1 -translate-y-1/2 rounded-r-full bg-cyan-400"></span>
        }
        {{ item.short }}
      </button>
    }
  </nav>
</aside>
