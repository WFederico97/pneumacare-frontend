<header class="flex h-16 items-center justify-between border-b border-slate-800 bg-slate-900/60 px-6 backdrop-blur">
  <div class="flex h-16 items-center justify-between gap-4 w-full">
    <div>
      <h1 class="text-lg font-semibold tracking-tight text-slate-100">Monitor Respiratorio UCI</h1>
      <p class="text-xs text-slate-400">Sistema de soporte para decisiones clínicas</p>
    </div>

    <div class="flex items-center gap-3 sm:gap-5">
      <app-shift-status />

      <div class="rounded-md border border-slate-700 bg-slate-950/80 px-2 py-1 font-mono text-xs text-slate-200" aria-label="Reloj actual">
        {{ clock() }}
      </div>

      <app-user-menu />
    </div>
  </div>
</header>
