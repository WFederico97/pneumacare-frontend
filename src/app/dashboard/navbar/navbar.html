<header class="flex h-16 items-center justify-between border-b border-slate-800 bg-slate-900/60 px-6 backdrop-blur">
  <div class="flex h-16 items-center justify-between gap-4 w-full">
    <div>
      <h1 class="text-lg font-semibold tracking-tight text-slate-100">Monitor Respiratorio UCI</h1>
      <p class="text-xs text-slate-400">Sistema de soporte para decisiones clínicas</p>
    </div>

    <div class="flex items-center gap-3 sm:gap-5">
      <div
        class="hidden items-center gap-2 rounded-full border border-emerald-500/30 bg-gradient-to-r from-emerald-500/15 to-cyan-500/15 px-3 py-1.5 md:flex"
        role="status"
        aria-live="polite"
        aria-label="Estado del sistema: en línea"
      >
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-70"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
        </span>
        <span class="text-xs font-medium text-emerald-200">Sistema estable</span>
      </div>

      <div class="rounded-md border border-slate-700 bg-slate-950/80 px-2 py-1 font-mono text-xs text-slate-200" aria-label="Reloj actual">
        {{ clock() }}
      </div>

      <div class="flex h-9 w-9 items-center justify-center rounded-full border border-cyan-500/30 bg-cyan-500/20 text-xs font-bold text-cyan-100">
        TH
      </div>
    </div>
  </div>
</header>
