<section class="w-full" aria-labelledby="beds-grid-title">
  <div class="mb-4 flex items-center justify-between gap-4">
    <div>
      <h2 id="beds-grid-title" class="text-base font-semibold text-slate-100">
        Estado de camas UCI
      </h2>
      <p class="mt-1 text-xs text-slate-300">
        Disponible = Verde ●, Ocupada = Rojo ■, Mantenimiento = Amarillo ◆
      </p>
    </div>

    <div class="flex items-center gap-2">
      <a
        routerLink="/beds/new"
        class="inline-flex min-h-[44px] items-center rounded-lg border border-cyan-500/60 px-3 text-xs font-medium text-cyan-200 transition-colors hover:border-cyan-400 hover:text-cyan-100"
      >
        Nueva cama
      </a>
      <button
        type="button"
        (click)="loadBeds()"
        [disabled]="bedsLoading()"
        class="min-h-[44px] rounded-lg border border-slate-600 px-3 text-xs font-medium text-slate-200 transition-colors hover:border-cyan-400 hover:text-cyan-300 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Actualizar camas
      </button>
    </div>
  </div>

  @if (bedsLoading()) {
    <div class="rounded-2xl border border-slate-700 bg-slate-900/80 p-6 text-sm text-slate-300">
      Cargando camas...
    </div>
  } @else if (bedsError()) {
    <div class="rounded-2xl border border-rose-700/50 bg-rose-950/30 p-6 text-sm text-rose-200">
      No se pudo cargar la grilla de camas.
    </div>
  } @else {
    <app-beds-grid [beds]="beds()" (bedSelected)="handleAvailableBedClick($event)" />
  }
</section>
