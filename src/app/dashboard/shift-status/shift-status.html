<div class="flex items-center gap-2 sm:gap-3">
  @if (isLoading()) {
    <div
      class="flex items-center gap-2 rounded-full border border-slate-600 bg-slate-800/70 px-3 py-1.5"
      role="status"
      aria-live="polite"
      aria-label="Verificando estado del turno"
    >
      <span class="h-2 w-2 animate-pulse rounded-full bg-slate-300"></span>
      <span class="text-xs font-medium text-slate-300">Verificando turno…</span>
    </div>
  } @else if (hasError()) {
    <div
      class="flex items-center gap-2 rounded-full border border-amber-500/40 bg-amber-500/10 px-3 py-1.5"
      role="status"
      aria-live="polite"
      aria-label="Estado del turno no disponible; evaluaciones bloqueadas"
    >
      <span class="h-2 w-2 rounded-full bg-amber-400"></span>
      <span class="text-xs font-medium text-amber-200">Estado no disponible</span>
    </div>
  } @else if (isShiftOpen()) {
    <div
      class="flex items-center gap-2 rounded-full border border-emerald-500/40 bg-emerald-500/15 px-3 py-1.5"
      role="status"
      aria-live="polite"
      aria-label="Turno abierto"
    >
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-70"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
      </span>
      <span class="text-xs font-medium text-emerald-200">Turno Abierto</span>
      <span class="hidden text-xs text-emerald-300/80 sm:inline" title="UCI {{ activeShift()?.icuId }}">
        · UCI {{ icuLabel() }} · {{ startedAtLabel() }}
      </span>
    </div>

    @if (isChief()) {
      <button
        type="button"
        (click)="closeShift()"
        [disabled]="isActionInFlight()"
        class="min-h-[36px] rounded-md border border-red-500/40 bg-red-500/10 px-3 py-1.5 text-xs font-semibold text-red-200 transition-colors hover:border-red-400 hover:text-red-100 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isActionInFlight() ? 'Cerrando…' : 'Cerrar Turno' }}
      </button>
    }
  } @else {
    <div
      class="flex items-center gap-2 rounded-full border border-red-500/40 bg-red-500/15 px-3 py-1.5"
      role="status"
      aria-live="polite"
      aria-label="Sin turno activo; evaluaciones bloqueadas"
    >
      <span class="h-2 w-2 rounded-full bg-red-400"></span>
      <span class="text-xs font-medium text-red-200">Sin Turno Activo</span>
    </div>

    @if (isChief()) {
      <button
        type="button"
        (click)="openShift()"
        [disabled]="isActionInFlight()"
        class="min-h-[36px] rounded-md border border-emerald-500/40 bg-emerald-500/10 px-3 py-1.5 text-xs font-semibold text-emerald-200 transition-colors hover:border-emerald-400 hover:text-emerald-100 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isActionInFlight() ? 'Abriendo…' : 'Abrir Turno' }}
      </button>
    }
  }

  @if (actionError()) {
    <span role="alert" class="text-xs font-medium text-red-300">{{ actionError() }}</span>
  }
</div>
