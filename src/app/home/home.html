<main class="min-h-screen bg-slate-950">
  <app-dashboard-sidebar />

  <div class="ml-20 flex min-h-screen flex-col">
    <app-dashboard-navbar />

    <section class="grid flex-1 gap-6 p-6 lg:grid-cols-5">
      <div class="lg:col-span-3">
        <app-beds-dashboard
          [admittedBed]="admittedBed()"
          (bedSelected)="handleBedSelected($event)"
        />
      </div>

      <div class="lg:col-span-2">
        @if (selectedBed()?.status === 'OCCUPIED') {
          <div class="mb-3 flex justify-end">
            <button
              type="button"
              (click)="clearSelectedBed()"
              class="rounded-md border border-slate-600 px-2.5 py-1 text-xs font-medium text-slate-200 transition-colors hover:border-cyan-400 hover:text-cyan-300"
            >
              Deseleccionar cama
            </button>
          </div>
          <app-detail-panel
            [selectedBedId]="selectedBed()?.bedId ?? null"
            [selectedBedNumber]="selectedBed()?.bedNumber ?? null"
            [patientId]="selectedBed()?.patientId ?? null"
          />
        } @else {
          <section class="rounded-2xl border border-slate-700/60 bg-slate-900/80 p-5 text-sm text-slate-300">
            Selecciona una cama ocupada para mostrar las acciones rápidas.
          </section>
        }
      </div>
    </section>

    <footer class="pb-6 pt-1 flex flex-col items-center gap-3" role="contentinfo">
      <p class="text-xs text-slate-700 tracking-widest uppercase">
        v0.0.1 &nbsp;·&nbsp; PNEUMACARE
      </p>
      <nav aria-label="Páginas legales">
        <ul class="flex gap-4 text-xs">
          <li>
            <a routerLink="/terms"
               class="text-slate-500 hover:text-cyan-400 transition-colors
                      focus-visible:outline-none focus-visible:ring-2
                      focus-visible:ring-cyan-400 rounded">
              Términos y Condiciones
            </a>
          </li>
          <li aria-hidden="true" class="text-slate-700">·</li>
          <li>
            <a routerLink="/faq"
               class="text-slate-500 hover:text-cyan-400 transition-colors
                      focus-visible:outline-none focus-visible:ring-2
                      focus-visible:ring-cyan-400 rounded">
              Preguntas Frecuentes
            </a>
          </li>
        </ul>
      </nav>
    </footer>
  </div>

  @if (isAdmissionModalOpen()) {
    <app-admission-modal
      [selectedBed]="selectedBed()"
      (close)="closeAdmissionModal()"
      (admitted)="handlePatientAdmitted($event)"
    />
  }

  @if (toastMessage()) {
    <div class="fixed bottom-5 right-5 z-50 rounded-lg border border-emerald-500/70 bg-emerald-950/80 px-4 py-2 text-sm font-medium text-emerald-100 shadow-lg">
      {{ toastMessage() }}
    </div>
  }
</main>
